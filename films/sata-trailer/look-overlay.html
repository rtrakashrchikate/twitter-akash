<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css">
<style>
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 80% 65% at 50% 45%,rgba(0,0,0,0) 50%,rgba(0,0,0,.6) 100%)}
#tint{position:absolute;inset:0;background:#0b2a33;mix-blend-mode:soft-light;opacity:.35}
#grain{position:absolute;inset:-300px;opacity:.1;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
.bar{position:absolute;left:0;right:0;height:150px;background:#000}
#lbl{position:absolute;bottom:60px;left:0;right:0;text-align:center;font-family:Mukta;font-weight:500;font-size:22px;color:rgba(244,241,234,.55)}
</style></head>
<body><div id="tint"></div><div id="vig"></div><div id="grain"></div><div class="bar" style="top:0"></div><div class="bar" style="bottom:0"></div>
<div id="lbl">नाट्य रूपांतरण · सर्व पात्रं व आवाज AI निर्मित · सामान्य कायदेशीर माहिती</div>
<script type="module">
import { fontsReady } from "./shared.js";
const g = document.getElementById("grain");
window.film = { ready: fontsReady(), frame(t) { const k = Math.floor(t * 24); g.style.transform = `translate(${(k * 37) % 300}px, ${(k * 53) % 300}px)`; } };
</script></body></html>
